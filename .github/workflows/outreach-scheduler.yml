name: Automated Cold Outreach Pipeline

on:
  schedule:
    # Runs Monday-Friday at 14:00 UTC (9:00 AM EST / 2:00 PM GMT)
    - cron: '0 14 * * 1-5'
    # Runs Monday-Friday at 18:00 UTC (1:00 PM EST / 6:00 PM GMT)
    - cron: '0 18 * * 1-5'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual trigger reason'
        required: false
        default: 'Manual batch dispatch'

permissions:
  contents: write

jobs:
  outreach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --omit=dev

      - name: Run Daily Outreach Batch & Send Email Report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'joshuaakintayo21@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD || 'nneqmxgopvucrlfu' }}
          SENDER_NAME: 'Joshua Akintayo'
          DAILY_EMAIL_LIMIT: 34
        run: node scripts/send-daily-batch.mjs

      - name: Commit and Push Updated Campaign State & Delivery Logs
        run: |
          git config user.name "ColdReach Bot"
          git config user.email "bot@coldreach.local"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: record daily outreach batch and update quota [skip ci]" && git push)
